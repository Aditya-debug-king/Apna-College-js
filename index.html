<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objects In JavaScript</title>
    <style>
        body {
            background-color: cadetblue;
        }
        #display {
            color: bisque;
            font-family: cursive;
            text-align: center;
            display: block;
            width: fit-content;
            margin: 20px auto;
            padding: 10px;
            animation: slideAndFade 3s ease-in-out infinite;
        }

        #display1 {
            color: brown;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        @keyframes slideAndFade {
            0% {
                transform: translateX(0px);
                background-color: lightcoral;
            }

            50% {
                background-color: gold;
                color: black;
                /* Added so bisque text stays readable on bright yellow! */
            }

            100% {
                transform: translateX(200px);
                background-color: lightgreen;
            }
        }
    </style>
</head>

<body>
    <h1 id="display"></h1>
    <h2 id="display1"></h2>

    <script>
        let favPpl = ["Sam", "20", "Wealthy", "Kind", "American", "Biker"];
        document.getElementById("display").innerHTML = "You are very " + favPpl[3];
        document.getElementById("display1").innerHTML = "Your name is " + favPpl[0];
    </script>
</body>

</html>
